specVersion: 0.0.4
description: Proov — Habit tracking on Celo
repository: https://github.com/MarvyNwaokobia/Proov

schema:
  file: ./schema.graphql

dataSources:
  - kind: ethereum/contract
    name: ProovCore
    network: celo
    source:
      address: "0x6f379efDb10aFD85b233aE35Ad01164c7bc54eE2"
      abi: ProovCore
      startBlock: 68295054
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      entities:
        - User
        - Habit
        - HabitCompletion
        - Streak
        - Milestone
      abis:
        - name: ProovCore
          file: ./abis/ProovCore.json
      eventHandlers:
        - event: HabitCreated(indexed address,indexed uint256,string,uint8,uint256,uint8)
          handler: handleHabitCreated
        - event: HabitCompleted(indexed address,indexed uint256,uint256,bytes32)
          handler: handleHabitCompleted
        - event: HabitDeactivated(indexed address,indexed uint256)
          handler: handleHabitDeactivated
        - event: HabitReactivated(indexed address,indexed uint256)
          handler: handleHabitReactivated
        - event: StreakUpdated(indexed address,uint256,uint256)
          handler: handleStreakUpdated
        - event: StreakBroken(indexed address,uint256)
          handler: handleStreakBroken
        - event: MilestoneReached(indexed address,uint256)
          handler: handleMilestoneReached
      file: ./src/proov-core.ts

  - kind: ethereum/contract
    name: SessionManager
    network: celo
    source:
      address: "0xea7d4608e9e2798D826d0DD698A7637EC83EA8d2"
      abi: SessionManager
      startBlock: 68295054
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      entities:
        - Session
      abis:
        - name: SessionManager
          file: ./abis/SessionManager.json
      eventHandlers:
        - event: SessionStarted(indexed address,indexed uint256)
          handler: handleSessionStarted
        - event: SessionCompleted(indexed address,indexed uint256,uint256)
          handler: handleSessionCompleted
        - event: SessionAbandoned(indexed address,indexed uint256,uint256)
          handler: handleSessionAbandoned
      file: ./src/session-manager.ts

  - kind: ethereum/contract
    name: CircleManager
    network: celo
    source:
      address: "0x5366DB5a7aB63ceDE7229d15179633CA69ad076D"
      abi: CircleManager
      startBlock: 68295054
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      entities:
        - CircleConnection
        - Cheer
      abis:
        - name: CircleManager
          file: ./abis/CircleManager.json
      eventHandlers:
        - event: CircleRequestSent(indexed address,indexed address)
          handler: handleCircleRequestSent
        - event: MemberAdded(indexed address,indexed address)
          handler: handleMemberAdded
        - event: CheerSent(indexed address,indexed address)
          handler: handleCheerSent
        - event: RemovedFromCircle(indexed address,indexed address)
          handler: handleRemovedFromCircle
      file: ./src/circle-manager.ts
