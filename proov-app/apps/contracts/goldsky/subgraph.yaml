specVersion: 0.0.4
description: Proov — Habit tracking on Celo
repository: https://github.com/MarvyNwaokobia/Proov

schema:
  file: ./schema.graphql

dataSources:
  - kind: ethereum/contract
    name: ProovCore
    network: celo
    source:
      address: "0xef6Bf51246A4B6972383632e66C87250Fc759922"
      abi: ProovCore
      startBlock: 68262187
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      entities:
        - User
        - Habit
        - HabitCompletion
        - Streak
        - Milestone
      abis:
        - name: ProovCore
          file: ./abis/ProovCore.json
      eventHandlers:
        - event: HabitCreated(indexed address,indexed uint256,string,uint8,uint256,uint8,uint256)
          handler: handleHabitCreated
        - event: HabitCompleted(indexed address,indexed uint256,uint256,uint256)
          handler: handleHabitCompleted
        - event: HabitDeactivated(indexed address,indexed uint256,uint256)
          handler: handleHabitDeactivated
        - event: StreakUpdated(indexed address,uint256,uint256,uint256)
          handler: handleStreakUpdated
        - event: StreakBroken(indexed address,uint256,uint256)
          handler: handleStreakBroken
        - event: MilestoneReached(indexed address,uint256,uint256)
          handler: handleMilestoneReached
      file: ./src/proov-core.ts

  - kind: ethereum/contract
    name: SessionManager
    network: celo
    source:
      address: "0x0bA82bb8de521d2D0BD63e0fa4ec2beF6ad9C1fb"
      abi: SessionManager
      startBlock: 68262187
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      entities:
        - Session
      abis:
        - name: SessionManager
          file: ./abis/SessionManager.json
      eventHandlers:
        - event: SessionStarted(indexed address,indexed uint256,uint256)
          handler: handleSessionStarted
        - event: SessionCompleted(indexed address,indexed uint256,uint256)
          handler: handleSessionCompleted
        - event: SessionAbandoned(indexed address,indexed uint256,uint256)
          handler: handleSessionAbandoned
      file: ./src/session-manager.ts

  - kind: ethereum/contract
    name: CircleManager
    network: celo
    source:
      address: "0xD5E46dE0fF1Cfd88ABe4bE5641650376516A7a5E"
      abi: CircleManager
      startBlock: 68262187
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      entities:
        - CircleConnection
        - Cheer
      abis:
        - name: CircleManager
          file: ./abis/CircleManager.json
      eventHandlers:
        - event: MemberAdded(indexed address,indexed address,uint256)
          handler: handleMemberAdded
        - event: CheerSent(indexed address,indexed address,uint256)
          handler: handleCheerSent
        - event: RemovedFromCircle(indexed address,indexed address,uint256)
          handler: handleRemovedFromCircle
      file: ./src/circle-manager.ts
