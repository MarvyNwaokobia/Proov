<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0c0c10;color:#fff;height:100vh;overflow:hidden;display:flex;flex-direction:column}
#topbar{background:#13131a;border-bottom:1px solid rgba(255,255,255,.07);padding:10px 20px;display:flex;align-items:center;gap:8px;flex-shrink:0;overflow-x:auto}
#topbar h1{font-size:13px;font-weight:800;white-space:nowrap;margin-right:4px}
#topbar h1 span{color:#6366f1}
.tbadge{font-size:9px;background:rgba(99,102,241,.15);color:#a5b4fc;border:1px solid rgba(99,102,241,.3);border-radius:20px;padding:3px 8px;font-weight:700;white-space:nowrap}
.sep{width:1px;height:18px;background:rgba(255,255,255,.1);flex-shrink:0;margin:0 4px}
.theme-btn{border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:5px 11px;font-size:10px;font-weight:700;cursor:pointer;background:rgba(255,255,255,.04);color:rgba(255,255,255,.5);transition:all .15s;white-space:nowrap}
.theme-btn:hover{background:rgba(255,255,255,.09);color:#fff}
.theme-btn.active{border-color:#6366f1;background:rgba(99,102,241,.2);color:#fff}
#main{display:flex;flex:1;overflow:hidden}
#snav{width:165px;background:#0e0e14;border-right:1px solid rgba(255,255,255,.06);overflow-y:auto;flex-shrink:0;padding:8px}
#snav::-webkit-scrollbar{display:none}
.snav-s{font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:rgba(255,255,255,.2);padding:10px 6px 4px}
.sbtn{display:block;width:100%;text-align:left;padding:6px 8px;border:none;border-radius:7px;font-size:11px;font-weight:500;cursor:pointer;background:transparent;color:rgba(255,255,255,.4);transition:all .1s;margin-bottom:1px;font-family:inherit}
.sbtn:hover{background:rgba(255,255,255,.06);color:rgba(255,255,255,.8)}
.sbtn.active{background:rgba(99,102,241,.15);color:#a5b4fc;font-weight:700}
#pw{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:16px}
#phone{width:375px;height:752px;background:var(--bg);border-radius:50px;border:9px solid #1c1c1e;box-shadow:0 0 0 1px rgba(255,255,255,.08),0 40px 80px rgba(0,0,0,.9),inset 0 0 0 1px rgba(255,255,255,.04);display:flex;flex-direction:column;overflow:hidden;position:relative;transition:background .3s}
#island{position:absolute;top:14px;left:50%;transform:translateX(-50%);width:116px;height:32px;background:#000;border-radius:18px;z-index:50;pointer-events:none}
#sbar{height:52px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 26px 8px;font-size:12px;font-weight:600;color:var(--text);flex-shrink:0;position:relative;z-index:10}
#sc{flex:1;overflow-y:auto;overflow-x:hidden}
#sc::-webkit-scrollbar{display:none}
#bnav{height:72px;background:var(--nav-bg);border-top:1px solid var(--border);display:flex;align-items:center;padding:0 4px 10px;flex-shrink:0}
.ni{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;padding:6px 0;border-radius:12px;position:relative}
.nic{font-size:20px;line-height:1;color:var(--text3);display:flex;align-items:center;justify-content:center}
.nil{font-size:9px;font-weight:600;color:var(--text3);letter-spacing:.3px;transition:color .15s}
.ni.active .nil,.ni.active .nic{color:var(--accent-text)}
.nbadge{position:absolute;top:2px;right:14px;min-width:14px;height:14px;background:#f43f5e;border-radius:7px;font-size:8px;font-weight:700;color:#fff;display:flex;align-items:center;justify-content:center;padding:0 3px}
#hind{height:8px;background:var(--nav-bg);display:flex;align-items:center;justify-content:center;flex-shrink:0}
#hind::after{content:'';width:100px;height:4px;background:var(--border2);border-radius:2px}
#notes{width:240px;background:#0e0e14;border-left:1px solid rgba(255,255,255,.06);overflow-y:auto;flex-shrink:0;padding:16px 14px}
#notes::-webkit-scrollbar{display:none}
#notes h3{font-size:12px;font-weight:700;color:rgba(255,255,255,.8);margin-bottom:12px}
.nitem{display:flex;gap:7px;margin-bottom:9px;font-size:10px;line-height:1.5;color:rgba(255,255,255,.45)}
.ntag{font-size:8px;font-weight:700;padding:2px 5px;border-radius:3px;flex-shrink:0;height:14px;margin-top:1px;letter-spacing:.3px}
.ntag.new{background:rgba(16,185,129,.2);color:#6ee7b7}
.ntag.changed{background:rgba(99,102,241,.2);color:#a5b4fc}
.ntag.removed{background:rgba(244,63,94,.15);color:#fda4af}
.ntag.kept{background:rgba(255,255,255,.07);color:rgba(255,255,255,.35)}
.ntag.nochange{background:rgba(245,158,11,.15);color:#fcd34d}
.page-hdr{background:var(--nav-bg);border-bottom:1px solid var(--border);padding:14px 18px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20}
.ph-title{font-size:16px;font-weight:800;color:var(--text);letter-spacing:-.3px}
.bbtn{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:var(--bg2);border:1px solid var(--border);color:var(--text2);cursor:pointer}
/* Flip card */
.flip-card{width:100%;cursor:pointer;-webkit-tap-highlight-color:transparent}
.flip-inner{display:grid;transition:transform .55s cubic-bezier(.4,0,.2,1);transform-style:preserve-3d}
.flip-front,.flip-back{grid-area:1/1;-webkit-backface-visibility:hidden;backface-visibility:hidden;border-radius:18px;overflow:hidden}
.flip-back{transform:rotateY(180deg)}
.flip-inner.flipped{transform:rotateY(180deg)}
</style>
</head>

function genLogoCircles(){
  let s='';
  for(let r=72;r<=430;r+=5){
    const sw=r<290?4.5:Math.max(2,4.5-(r-290)*0.015);
    const c=2*Math.PI*r;
    const g=c*0.06;
    const d=c-g;
    const o=(r*2.4)%c;
    s+=`<circle cx="255" cy="150" r="${r}" fill="none" stroke="url(#fpg)" stroke-width="${sw.toFixed(1)}" stroke-dasharray="${d.toFixed(1)} ${g.toFixed(1)}" stroke-dashoffset="${o.toFixed(1)}"/>`;
  }
  return s;
}

signin:{title:'Sign In / Join Free — Google only',nav:false,notes:[
{t:'new',s:'Google is the only social option — Twitter, Facebook, Discord removed'},
{t:'new',s:'Tab switcher: Sign in | Join free — same screen, same logic'},

{t:'removed',s:'"More options" button removed'},

{t:'kept',s:'Session expired notice banner stays'},
],html:`<div style="background:var(--bg);min-height:100%;display:flex;flex-direction:column;align-items:center;padding:0 20px 32px;position:relative">

  <!-- blobs -->

  </div>

    <!-- Logo -->

      <div id="auth-heading" style="font-size:22px;font-weight:800;color:var(--text);letter-spacing:-.5px;margin-bottom:3px">Welcome back</div>
      <div id="auth-sub" style="font-size:13px;color:var(--text2)">Take accountability for your habits</div>
    </div>

    <!-- Tab switcher -->
    <div style="display:flex;background:var(--bg2);border-radius:12px;padding:4px;gap:4px;margin-bottom:18px">
      <button id="tab-signin" onclick="authTab('signin')" style="flex:1;text-align:center;padding:9px 0;border-radius:9px;border:none;cursor:pointer;font-family:inherit;font-size:13px;transition:all 0.2s;background:var(--card-bg);color:var(--text);font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.07)">Sign in</button>
      <button id="tab-join" onclick="authTab('join')" style="flex:1;text-align:center;padding:9px 0;border-radius:9px;border:none;cursor:pointer;font-family:inherit;font-size:13px;transition:all 0.2s;background:transparent;color:var(--text3);font-weight:500;box-shadow:none">Join free</button>
    </div>

    <!-- Session notice -->
    <div id="auth-notice" style="display:none;background:rgba(244,63,94,.08);border:1px solid rgba(244,63,94,.2);border-radius:10px;padding:9px 12px;font-size:11px;color:#f43f5e;margin-bottom:14px;line-height:1.5">
      Your session expired. Tap "Continue with Google" to pick up where you left off.
    </div>

    <!-- Google button -->
    <button onclick="void 0" style="width:100%;padding:13px 16px;border-radius:13px;border:1.5px solid var(--border);background:var(--card-bg);color:var(--text);font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:12px;cursor:pointer;font-family:inherit;margin-bottom:16px;transition:all .15s;box-shadow:0 1px 3px rgba(0,0,0,.06)"
      onmouseover="this.style.background='var(--bg3)';this.style.borderColor='var(--border2)'"
      onmouseout="this.style.background='var(--card-bg)';this.style.borderColor='var(--border)'">
      <!-- Google SVG -->
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" style="flex-shrink:0">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
      </svg>
      Continue with Google
    </button>

    <!-- Divider -->
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">
      <div style="flex:1;height:1px;background:var(--border)"></div>
      <span style="font-size:11px;color:var(--text3);font-weight:500">or use email</span>
      <div style="flex:1;height:1px;background:var(--border)"></div>
    </div>

    <!-- Email field -->
    <input type="email" placeholder="your@email.com" style="width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--border2);background:var(--bg2);color:var(--text);font-size:13px;margin-bottom:10px;font-family:inherit;outline:none"/>
    <button style="width:100%;padding:12px;border-radius:12px;border:none;background:var(--btn-primary-bg);color:var(--btn-primary-text);font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;margin-bottom:18px">
      Send magic link
    </button>

    <!-- Footer -->
    <div id="auth-footer" style="text-align:center;font-size:12px;color:var(--text3)">
      No account? <span style="color:var(--accent-text);font-weight:700;border-bottom:1.5px solid var(--accent-text);padding-bottom:1px;cursor:pointer" onclick="authTab('join')">Join free →</span>
    </div>

  </div>
</div>
`},

onboarding:{title:'Onboarding — No Redesign',nav:false,notes:[

dashboard:{title:'Dashboard',nav:true,notes:[
{t:'new',s:'Streak card flips on tap — front shows streak, back shows goal'},
{t:'new',s:'Goal milestones: 7 → 14 → 21 → 30 days, auto-advances when hit'},
{t:'changed',s:'Fuel replaces all currency refs — 48 Fuel pill in header'},
{t:'changed',s:'All emojis replaced with icons'},
{t:'removed',s:'All blockchain / crypto terminology'},
{t:'kept',s:'Greeting, today habits grid, circle preview, leaderboard snippet'},
],html:`<div style="background:var(--bg);padding-bottom:16px">
<div style="padding:14px 18px 0;display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px">
  <div>
    <div style="font-size:16px;font-weight:800;color:var(--text);letter-spacing:-.3px">Good morning, Marvy</div>
    <div style="font-size:11px;color:var(--text3);margin-top:2px">Saturday, May 23</div>
  </div>
  <div style="display:flex;align-items:center;gap:7px">
    <div style="padding:5px 10px;border-radius:20px;background:var(--bg2);border:1px solid var(--border);font-size:11px;color:var(--accent-text);display:flex;align-items:center;gap:4px;font-weight:600"><i class="ti ti-bolt" style="font-size:12px"></i>48 Fuel</div>
    <div onclick="go('settings')" style="width:28px;height:28px;border-radius:8px;background:var(--bg2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--text3);cursor:pointer"><i class="ti ti-settings" style="font-size:14px"></i></div>
  </div>
</div>
<div style="margin:0 18px 16px">
  <div class="flip-card" onclick="this.querySelector('.flip-inner').classList.toggle('flipped')">
    <div class="flip-inner">
      <div class="flip-front" style="background:var(--hero-bg);padding:16px 18px;color:#fff">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px">
          <div>
            <div style="font-size:10px;color:rgba(255,255,255,.6);text-transform:uppercase;letter-spacing:.08em;margin-bottom:2px">Current streak</div>
            <div style="display:flex;align-items:baseline;gap:5px"><span style="font-size:40px;font-weight:900;letter-spacing:-2px;line-height:1">23</span><span style="display:flex;align-items:center;gap:3px;font-size:14px;color:rgba(255,255,255,.8)"><i class="ti ti-flame" style="font-size:15px"></i>days</span></div>
          </div>
          <div style="text-align:right;background:rgba(255,255,255,.12);border-radius:10px;padding:7px 10px">
            <div style="font-size:9px;color:rgba(255,255,255,.5);margin-bottom:1px">Goal</div>
            <div style="font-size:18px;font-weight:900;line-height:1">30d</div>
            <div style="font-size:9px;color:rgba(255,255,255,.45);margin-top:1px">7 to go</div>
          </div>
        </div>
        <div style="margin-bottom:8px">
          <div style="display:flex;justify-content:space-between;font-size:10px;color:rgba(255,255,255,.6);margin-bottom:4px"><span>Today</span><span>3 of 5 done</span></div>
          <div style="height:4px;background:rgba(255,255,255,.2);border-radius:2px"><div style="height:100%;width:60%;background:rgba(255,255,255,.85);border-radius:2px"></div></div>
        </div>
        <div style="display:flex;gap:4px">
          ${['S','M','T','W','T','F','S'].map((d,i)=>{const done=i<6,today=i===6;return`<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px"><div style="font-size:7px;color:rgba(255,255,255,.4);font-weight:600">${d}</div><div style="width:100%;aspect-ratio:1;border-radius:5px;background:${done?'rgba(255,255,255,.85)':today?'transparent':'rgba(255,255,255,.12)'};border:${today?'2px solid rgba(255,255,255,.5)':'none'};display:flex;align-items:center;justify-content:center;font-size:9px;color:${done?'#047857':today?'rgba(255,255,255,.8)':'rgba(255,255,255,.25)'};font-weight:700">${done?'✓':today?'·':''}</div></div>`;}).join('')}
        </div>
        <div style="display:flex;align-items:center;justify-content:flex-end;gap:3px;margin-top:6px;font-size:8px;color:rgba(255,255,255,.25)"><i class="ti ti-refresh" style="font-size:9px"></i>Tap for goal</div>
      </div>
      <div class="flip-back" style="background:var(--hero-bg);padding:16px 18px;color:#fff">
        <div style="display:flex;align-items:center;gap:5px;font-size:10px;font-weight:700;color:rgba(255,255,255,.6);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px"><i class="ti ti-target" style="font-size:13px"></i>Goal Progress</div>
        <div style="display:flex;align-items:baseline;gap:5px;margin-bottom:10px"><span style="font-size:28px;font-weight:900;letter-spacing:-1px;line-height:1">30</span><span style="font-size:13px;color:rgba(255,255,255,.7)">day milestone</span></div>
        <div style="margin-bottom:10px">
          <div style="display:flex;justify-content:space-between;font-size:10px;color:rgba(255,255,255,.6);margin-bottom:5px"><span>Day 23 of 30</span><span>7 days to go</span></div>
          <div style="height:6px;background:rgba(255,255,255,.2);border-radius:3px"><div style="height:100%;width:76.7%;background:rgba(255,255,255,.9);border-radius:3px"></div></div>
        </div>
        <div style="display:flex;gap:5px;margin-bottom:10px">
          ${[{d:'7d',done:true},{d:'14d',done:true},{d:'21d',done:true},{d:'30d',cur:true}].map(m=>`<div style="flex:1;text-align:center;padding:6px 2px;border-radius:8px;background:${m.done?'rgba(255,255,255,.9)':m.cur?'rgba(255,255,255,.15)':'rgba(255,255,255,.08)'};border:${m.cur?'1.5px solid rgba(255,255,255,.5)':'none'};font-size:9px;font-weight:700;color:${m.done?'#047857':m.cur?'#fff':'rgba(255,255,255,.3)'}">${m.done?'✓ ':''}<span>${m.d}</span></div>`).join('')}
        </div>
        <div style="font-size:9px;color:rgba(255,255,255,.35);text-align:center">Hit 30 days → next goal becomes 60 days</div>
        <div style="display:flex;align-items:center;justify-content:flex-end;gap:3px;margin-top:8px;font-size:8px;color:rgba(255,255,255,.25)"><i class="ti ti-refresh" style="font-size:9px"></i>Tap to go back</div>
      </div>
    </div>
  </div>
</div>
<div style="padding:0 18px;margin-bottom:14px">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
    <span style="font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:var(--text3)">TODAY</span>
    <span onclick="go('habits')" style="font-size:11px;color:var(--accent-text);font-weight:600;cursor:pointer">Manage →</span>
  </div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px">
    ${[{icon:'brain',n:'Deep Work',d:'90 min',s:12,done:true,type:'timed'},{icon:'run',n:'Morning Run',d:'30 min',s:7,done:false,type:'timed'},{icon:'droplet',n:'Water',d:'Checkbox',s:3,done:true,type:'check'},{icon:'book-2',n:'Read',d:'30 min',s:0,done:false,type:'timed'}].map(h=>`<div style="background:var(--card-bg);border:1px solid ${h.done?'var(--accent-border)':'var(--card-border)'};border-radius:14px;padding:11px;opacity:${h.done?.75:1}"><div style="margin-bottom:5px;color:var(--accent-text)"><i class="ti ti-${h.icon}" style="font-size:20px"></i></div><div style="font-size:12px;font-weight:700;color:var(--text);margin-bottom:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${h.n}</div><div style="font-size:9px;color:var(--text3);margin-bottom:8px">${h.d}${h.s>0?' · '+h.s+'d':''}${h.done?' · Done':''}</div><button style="width:100%;padding:6px 0;border-radius:8px;border:${h.done?'none':'1.5px solid var(--border2)'};background:${h.done?'var(--accent)':'transparent'};color:${h.done?'#fff':'var(--text2)'};font-size:10px;font-weight:700;cursor:pointer">${h.done?'Done':h.type==='timed'?'Start':'Mark done'}</button></div>`).join('')}
  </div>
  <button onclick="go('create_habit')" style="width:100%;padding:12px;border:2px dashed var(--border2);border-radius:13px;background:transparent;cursor:pointer;color:var(--text3);font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px"><i class="ti ti-plus" style="font-size:14px"></i>Add habit</button>
</div>
<div style="padding:0 18px;margin-bottom:14px">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
    <span style="font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:var(--text3)">CIRCLE</span>
    <span onclick="go('circle')" style="font-size:11px;color:var(--accent-text);font-weight:600;cursor:pointer">Manage →</span>
  </div>
  <div style="background:var(--card-bg);border:1px solid var(--card-border);border-radius:14px;overflow:hidden">
    ${[{u:'tola',s:42,act:'Workout done · 2h ago',done:true,btn:'Cheer',ic:'star'},{u:'amara',s:7,act:'No activity yet today',done:false,btn:'Nudge',ic:'hand-stop'}].map((m,i)=>`<div style="display:flex;align-items:center;gap:10px;padding:11px 14px;${i===0?'border-bottom:1px solid var(--border)':''}"><div style="width:32px;height:32px;border-radius:10px;background:var(--accent-bg);border:1px solid var(--accent-border);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--accent-text);flex-shrink:0">${m.u.slice(0,2).toUpperCase()}</div><div style="flex:1;min-width:0"><div style="font-size:12px;font-weight:700;color:var(--text)">@${m.u}</div><div style="font-size:10px;color:${m.done?'var(--accent-text)':'var(--text3)'}">${m.act}</div></div><button style="padding:5px 9px;border-radius:8px;font-size:10px;font-weight:700;cursor:pointer;border:1px solid ${m.done?'var(--pink-text)':'var(--border2)'};background:${m.done?'var(--pink-bg)':'transparent'};color:${m.done?'var(--pink-text)':'var(--text3)'};display:flex;align-items:center;gap:3px;white-space:nowrap"><i class="ti ti-${m.ic}" style="font-size:10px"></i>${m.btn}</button></div>`).join('')}
  </div>
</div>
<div style="padding:0 18px">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
    <span style="font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:var(--text3)">LEADERBOARD</span>
    <span onclick="go('leaderboard')" style="font-size:11px;color:var(--accent-text);font-weight:600;cursor:pointer">See all →</span>
  </div>
  <div style="background:var(--card-bg);border:1px solid var(--card-border);border-radius:14px;overflow:hidden">
    ${[{r:'1',n:'@marcus',s:87,gold:true},{r:'2',n:'@tola',s:42,silver:true},{r:'14',n:'You · @marvy',s:23,me:true}].map((row,i)=>`<div style="display:flex;align-items:center;gap:10px;padding:9px 12px;${i<2?'border-bottom:1px solid var(--border)':''}${row.me?';background:var(--accent-bg)':''}"><span style="font-size:11px;font-weight:800;min-width:22px;color:${row.me?'var(--accent-text)':row.gold?'#f59e0b':row.silver?'#9ca3af':'var(--text3)'}">#${row.r}</span><span style="flex:1;font-size:12px;font-weight:${row.me?700:500};color:var(--text)">${row.n}</span><span style="font-size:11px;font-weight:700;color:var(--streak);display:flex;align-items:center;gap:3px"><i class="ti ti-flame" style="font-size:12px"></i>${row.s}</span></div>`).join('')}
  </div>
</div>
</div>`},

timer_running:{title:'Timer — Running (Focus Mode)',nav:false,notes:[

{t:'kept',s:'SVG ring, pulse glow, cancel button'},
{t:'changed',s:'Icons replace emojis in habit label'},

    <circle cx="110" cy="110" r="94" fill="none" stroke="var(--accent)" stroke-width="12" stroke-linecap="round" stroke-dasharray="590.6" stroke-dashoffset="177" style="filter:drop-shadow(0 0 8px var(--accent))"/>

function authTab(t){
  const isJoin=t==='join';
  const ts=document.getElementById('tab-signin');const tj=document.getElementById('tab-join');
  if(!ts||!tj)return;
  ts.style.background=isJoin?'transparent':'var(--card-bg)';ts.style.color=isJoin?'var(--text3)':'var(--text)';ts.style.fontWeight=isJoin?'500':'700';ts.style.boxShadow=isJoin?'none':'0 1px 4px rgba(0,0,0,.07)';
  tj.style.background=isJoin?'var(--card-bg)':'transparent';tj.style.color=isJoin?'var(--text)':'var(--text3)';tj.style.fontWeight=isJoin?'700':'500';tj.style.boxShadow=isJoin?'0 1px 4px rgba(0,0,0,.07)':'none';
  const h=document.getElementById('auth-heading');const s=document.getElementById('auth-sub');const f=document.getElementById('auth-footer');const n=document.getElementById('auth-notice');
  if(h)h.textContent=isJoin?'Welcome to Proov':'Welcome back';
  if(s)s.textContent=isJoin?'Your discipline. Onchain.':'Take accountability for your habits';
  if(f)f.innerHTML=isJoin?'Already have an account? <span style="color:var(--accent-text);font-weight:700;border-bottom:1.5px solid var(--accent-text);padding-bottom:1px;cursor:pointer" onclick="authTab(\'signin\')">Sign in →</span>':'No account? <span style="color:var(--accent-text);font-weight:700;border-bottom:1.5px solid var(--accent-text);padding-bottom:1px;cursor:pointer" onclick="authTab(\'join\')">Join free →</span>';
  if(n)n.style.display=isJoin?'none':'block';
}
function applyTheme(id){
  const t=T[id];const ph=document.getElementById('phone');
  Object.entries(t).forEach(([k,v])=>ph.style.setProperty(k,v));
  document.querySelectorAll('.theme-btn').forEach(b=>b.classList.toggle('active',b.getAttribute('onclick').includes("'"+id+"'")));
}
function go(id){
  const s=S[id];if(!s)return;
  document.getElementById('sc').innerHTML=s.html;
  const hasNav=s.nav!==false;
  document.getElementById('bnav').style.display=hasNav?'flex':'none';
  document.getElementById('hind').style.display=hasNav?'flex':'none';
  document.getElementById('sc').scrollTop=0;
  document.querySelectorAll('.sbtn').forEach(b=>b.classList.toggle('active',b.getAttribute('onclick').includes("'"+id+"'")));
  const active=navMap[id]||'';
  document.querySelectorAll('.ni').forEach(n=>n.classList.toggle('active',n.dataset.nav===active&&active!==''));
  document.getElementById('ntitle').textContent=s.title;
  document.getElementById('nbody').innerHTML=s.notes.map(n=>`<div class="nitem"><span class="ntag ${n.t}">${n.t.toUpperCase()}</span><span>${n.s}</span></div>`).join('');
}
